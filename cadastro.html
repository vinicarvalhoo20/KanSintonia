<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KanSintonia - Cadastro</title>
  <link rel="icon" href="/assets/iconeKan.png">
  <link rel="stylesheet" href="style.css">
</head>
<body >
<header>
  <a class="logo" href="index.html"><img src="/assets/iconeKan.png" alt="" class="logo-icone"><span>KanSintonia</span></a>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="login.html">Login</a></li>
      <li class="item-submenu">
        <a href="#" id="btn-sobre">Sobre ▾</a>
        <ul class="menu-vertical" id="menu-vertical-sobre">
          <li><a href="#" data-info="empresa">Empresa</a></li>
          <li><a href="#" data-info="clientes">Clientes</a></li>
        </ul>
      </li>
      <li class="item-submenu">
        <a href="#" id="btn-contato">Contato ▾</a>
        <ul class="menu-vertical" id="menu-vertical-contato">
          <li><a href="tel:+553200000000">Telefones: (32) 0000-0000</a></li>
          <li><a href="mailto:contato@kansintonia.com">Email: contato@kansintonia.com</a></li>
        </ul>
      </li>
    </ul>
  </nav>
</header>
<main>
  <section class="card-form">
    <h1>Cadastro</h1>
    <form id="form-cadastro" novalidate>
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" name="endereco" placeholder="Rua, número, cidade" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" minlength="4" placeholder="Mínimo 4 caracteres" required>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" inputmode="numeric" maxlength="15" placeholder="(32) 99999-9999" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>

      <p id="msg-cadastro" class="mensagem" role="alert"></p>
      <div class="botoes-form">
        <button type="submit" class="btn">Cadastrar</button>
        <a class="btn" href="index.html">Sair</a>
      </div>
    </form>
    <p class="link-extra">Já tem conta? <a href="login.html">Entrar</a></p>
  </section>
</main>
<footer>
  <p>Hoje é <span id="data-atual"></span></p>
  <p>Todos os direitos reservados. Desenvolvido por: Vinicius Eduardo</p>
</footer>
  <script src="script.js"></script>
</body>
</html>
